type: object
required:
  - _id
  - name
  - phoneNumber
  - isFavourite
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '12345678'
  email:
    description: "Contact's email"
    type: string
    example: 'user@mail.com'
  isFavourite:
    description: 'Is Contact favourite'
    type: boolean
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: "Contact's parent id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to Contact's photo"
    type: string
    example: https://res.cloudinary.com/di0erfgtg/image/upload/v1740433045/contacts/y9mpkkr3cwjxyas3qh45.jpg
